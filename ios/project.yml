# Generate the Xcode project with XcodeGen:  brew install xcodegen && cd ios && xcodegen
name: Mise
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mise:
    type: application
    platform: iOS
    sources:
      - path: Mise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mise   # change to your own reverse-DNS id
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""                          # set in Xcode › Signing & Capabilities
        CODE_SIGN_STYLE: Automatic
    info:
      path: Mise/Info.plist
      properties:
        CFBundleDisplayName: Mise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.example.mise.oauth
            CFBundleURLSchemes: [mise]
