[alembic]
script_location = alembic

# Date-prefixed filenames so `ls versions/` reads in the order they applied.
# Alembic itself only cares about the revision id inside the file.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is deliberately absent. env.py reads it from the application
# settings so there is exactly one place the database location is defined,
# and no chance of migrations running against a different file than the app.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
