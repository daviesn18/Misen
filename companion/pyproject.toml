[project]
name = "misen-companion"
version = "0.1.0"
description = "Misen Companion API — pantry, weekly menu, recipe scaling, shopping proxy, Basil chat proxy"
requires-python = ">=3.11"

# Each phase adds what it actually needs rather than carrying unused pins.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    # The MCP connector shapes Basil depends on (mcp_toolset in `tools`,
    # the mcp-client-2025-11-20 beta) need a recent SDK; the previous
    # connector version put tool configuration somewhere else entirely.
    "anthropic>=0.121",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # required by fastapi.testclient
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes the migration bodies; reformatting generated code to satisfy
# a line-length rule only makes the next autogenerate diff noisier.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
