[project]
name = "misen-companion"
version = "0.1.0"
description = "Misen Companion API — pantry, weekly menu, recipe scaling, shopping proxy, Basil chat proxy"
requires-python = ">=3.11"

# Phase 0 dependencies only. Each later phase adds what it actually needs
# rather than carrying unused pins:
#   phase 1 — httpx (Mealie proxy)
#   phase 5 — anthropic (Basil chat proxy)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # required by fastapi.testclient
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
