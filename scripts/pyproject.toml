[project]
name = "misen-recipes"
version = "0.1.0"
description = "One-off jobs that get recipes into Mealie"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recipes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The parser fixtures reproduce lines from a converted PDF verbatim. Wrapping
# them to satisfy a line-length rule would change the thing under test.
per-file-ignores = { "tests/test_cookbook.py" = ["E501"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
